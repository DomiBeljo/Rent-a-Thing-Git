spring.application.name=Rent-a-Thing-Proba

# ── Datasource ─────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ── HikariCP connection pool ───────────────────────────────────────────────
# Supabase free tier: max 60 connections (direktni port 5432)
# Supabase transaction pooler (port 6543): možeš povećati na 20-30
# Preporuka: koristi port 6543 (transaction pooler) u SPRING_DATASOURCE_URL
# npr. postgresql://db.xxxx.supabase.co:6543/postgres?pgbouncer=true
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
# Keepalive za Supabase koji gasi idle konekcije
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Batch insert/update — drastično ubrzava bulk operacije (expirePendingBookings,
# save više chat poruka, itd.)
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Ne generira statistike u produkciji (smanjuje overhead)
spring.jpa.properties.hibernate.generate_statistics=false

# Isključi Open Session In View — sprječava lazy load querye izvan transakcije
# i izbjegava držanje DB konekcije otvorene za cijeli HTTP request
spring.jpa.open-in-view=false

# ── JWT ────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET_KEY}
app.jwt.expiration-ms=604800000

# ── Mail ───────────────────────────────────────────────────────────────────
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── CORS ───────────────────────────────────────────────────────────────────
cors.allowed-origins=http://localhost:8081,http://192.168.100.8:8081

# ── Upload ─────────────────────────────────────────────────────────────────
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.base-url=${APP_BASE_URL:http://localhost:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

spring.config.import=optional:file:.env[.properties]
server.servlet.context-path=/api